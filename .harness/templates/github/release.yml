name: Harness Release Eligibility

on:
  workflow_run:
    workflows: ["Harness Required"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  release-ready:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsuccessful required run
        if: github.event.workflow_run.conclusion != 'success'
        run: exit 1
      - name: Verify successful required run belongs to merged commit
        if: github.event.workflow_run.conclusion == 'success'
        id: lifecycle
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const refs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: run.head_sha, per_page: 100
            });
            const targetBranch = context.payload.repository.default_branch;
            const merged = refs.filter(item => item.merged_at && item.merge_commit_sha === run.head_sha
              && item.base.ref === targetBranch);
            core.setOutput('eligible', merged.length === 1 ? 'true' : 'false');
      - name: Reject non-target or non-merge run
        if: steps.lifecycle.outputs.eligible != 'true'
        run: exit 1
      - name: Download required result artifact
        if: steps.lifecycle.outputs.eligible == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: harness-result-*
          path: harness-artifacts
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v4
        if: steps.lifecycle.outputs.eligible == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Build result-bound release eligibility receipt
        if: steps.lifecycle.outputs.eligible == 'true'
        env:
          VERIFIED_COMMIT: ${{ github.event.workflow_run.head_sha }}
          REQUIRED_RUN_ID: ${{ github.event.workflow_run.id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 .harness/scripts/release_eligibility.py \
            --result harness-artifacts/harness-result.json \
            --commit "$VERIFIED_COMMIT" --repository "$REPOSITORY" \
            --required-run-id "$REQUIRED_RUN_ID" --output release-eligibility.json
      - name: Upload release eligibility receipt
        if: steps.lifecycle.outputs.eligible == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-eligibility-${{ github.event.workflow_run.head_sha }}
          path: release-eligibility.json
          if-no-files-found: error

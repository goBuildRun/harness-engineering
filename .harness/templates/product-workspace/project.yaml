# {{product_name}} product workspace configuration for the harness-engineering.
# This file belongs to the product repository. It declares where this product
# stores planning artifacts, local runs, knowledge, and evidence.

product:
  id: {{product_id}}
  name: {{product_name}}
  profile: {{profile}}

workspace:
  root: {{workspace}}
  planning: planning
  runs: runs
  knowledge: knowledge
  evidence: evidence

planning:
  product_specs: product-specs
  exec_plans_active: exec-plans/active
  exec_plans_completed: exec-plans/completed
  tasks: tasks

runs:
  agent_workspace: .

knowledge:
  context_file: CONTEXT.md
  lessons_file: LESSONS.md
  reference_systems_file: REFERENCE_SYSTEMS.md

evidence:
  summaries_dir: summaries
  progress_dir: progress
  test_reports_dir: test-reports
  review_reports_dir: review-reports
  growth_reports_dir: growth-reports
  intake_reports_dir: intake-reports

harness:
  task_contract: harness-task-v1

enforcement:
  # 安装 workspace 不等于 enforced。只有 live audit 四项全通过时才会升级状态。
  mode: shadow
  platform: github
  repository: ""
  target_branch: main
  required_check: harness-commit-acceptance

intake:
  # Brownfield intake needs ownership boundaries. By default everything is
  # treated as product-owned. Add scopes when the repo contains upstream,
  # vendor, generated, or reference code.
  default_scope:
    role: product-owned
    review: full
    debt: track
    description: "默认按产品自有代码处理。"
  scopes: []
  # Example:
  # scopes:
  #   - path: third_party/framework
  #     role: upstream-reference
  #     review: core-logic-and-features
  #     debt: ignore
  #     description: "官方/上游代码，只理解核心逻辑和可复用特性，不追踪上游技术债。"
  #   - path: third_party/framework/mobile
  #     role: product-owned
  #     review: full
  #     debt: track
  #     description: "本产品在上游目录内承载的自研 App。"

work_item:
  provider: {{work_item_provider}}
  id_pattern: "{{work_item_id_pattern}}"
  sync_contract: bmad-work-item-v1
  # Work Item 只承载负责人、状态、讨论、摘要和 Harness Links。
  # 完整 BMAD 产物真相源始终是本仓库 {{workspace}}/planning/。
  # Product-specific provider configuration can live here when it is not secret.
  # Secrets must stay in environment variables or .env.
  providers:
    teambition:
      project_id: ""
      # Optional product default assignee. Use --assignee for one-off sync.
      assignee_id: ""
      # Optional Teambition organization ID for open.teambition.com v3 discovery APIs.
      tenant_id: ""
      tenant_type: organization
      # Optional Teambition Open App ID. Secret must stay in env as
      # TEAMBITION_OPEN_APP_SECRET.
      open_app_id: ""
      # Optional Teambition item type. Configure the "任务" type ID when the
      # project also has "需求" or other workflow types.
      scenariofieldconfig_id: ""
    feishu:
      tasklist_guid: ""
      list_tasks_path: /open-apis/task/v2/tasks
      list_query: {}
      # Optional product default assignee. Use --assignee for one-off sync.
      assignee_id: ""
    jira:
      base_url: ""
      project_key: ""
      issue_type: Task
      # Optional Jira accountId default assignee. Use --assignee for one-off sync.
      assignee_id: ""

bmad:
  install_root: .
  output_root: "{{workspace}}/bmad-output"
  normalized_planning_root: "{{workspace}}/planning"
  product_specs: product-specs
  exec_plans_active: exec-plans/active
  tasks: tasks

quality:
  env: {}
  required:
    lint: false
    test: false
  commands:
    # 每个产品按自己的技术栈配置。严格 CI 下未配置会 block。
    # 安全边界由 harness-engineering 控制：禁止 shell 绕行、PATH/NODE_OPTIONS 等危险 env、未 allowlist 的可执行文件。
    lint: []
    # Example product-owned import boundary (do not put domain paths in generic defaults):
    # - builtin: python-import-boundaries
    #   paths: [services]
    #   boundaries:
    #     - from: services/api
    #       forbid: [services.db]
    test: []

# Generic brownfield profile.
#
# This profile is intentionally permissive for existing projects whose package
# boundaries are not yet modeled. Use it for first intake, then create a
# product-specific profile once stable directories and forbidden zones are known.

allow_all: true
allowed_roots: []

forbidden_globs:
  - ".env"
  - ".env.*"
  - "**/.env"
  - "**/.env.*"
  - "*key*.json"
  - "*secret*.json"
  - "**/*key*.json"
  - "**/*secret*.json"
  - "**/node_modules/**"
  - "**/.pnpm-store/**"
  - "**/.venv/**"
  - "**/site-packages/**"
  - "**/__pycache__/**"

forbid_root_py: false

protected_prefixes:
  - node_modules/
  - .pnpm-store/
  - .venv/
  - site-packages/

protected_exceptions: []

service_layers:
  - app/
  - src/
  - packages/
  - services/
  - backend/
  - frontend/
  - web/
  - tests/

api_file_globs: []
max_api_file_lines: 200

# harness-engineering 默认配置
# 产品仓库使用 <product-root>/harness-workspace/project.yaml 声明自身 workspace。
# 本文件只提供兼容默认值；“当前管理哪个产品”由 .harness/products/registry.yaml
# 与 .harness/products/active-product.json 决定。

harness:
  name: Team Product R&D Harness
  # profile 用于承载具体产品/领域约束。core 默认保持 generic；
  # 具体产品约束应通过产品侧 project.yaml 或 profile 声明。
  profile: generic
  product_id: product
  product_name: Product
  task_contract: harness-task-v1
  knowledge_root: ../knowledge
  evidence_root: ../evidence
  context_file: CONTEXT.md
  lessons_file: LESSONS.md
  summaries_dir: summaries
  progress_dir: progress
  test_reports_dir: test-reports
  review_reports_dir: review-reports
  growth_reports_dir: growth-reports
  intake_reports_dir: intake-reports

phase0:
  # 兼容字段：历史 Phase 0 现在语义为 BMAD Planning；产品侧目录使用 harness-workspace/planning。
  root: harness-workspace/planning
  product_specs: product-specs
  exec_plans_active: exec-plans/active
  exec_plans_completed: exec-plans/completed
  tasks: tasks
  # 本地运行状态与 Harness Execution 任务工作区，位于 harness-workspace/runs。
  agent_workspace: ../runs

bmad:
  # BMAD Method 安装目录（`npx bmad-method install` 生成 _bmad/）
  install_root: .
  # BMAD 原生输出目录；正式 BMAD Planning 产物仍映射到 phase0.root。
  output_root: harness-workspace/bmad-output

name: Harness Commit Acceptance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  harness-commit-acceptance:
    name: harness-commit-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run lifecycle acceptance tests
        run: >-
          python -m unittest
          tests.test_ael_attestation
          tests.test_ael_schema
          tests.test_git_native_contract
          tests.test_public_repository
          tests.test_runtime_module_boundaries

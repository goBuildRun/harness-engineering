name: Harness Required

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, closed]

permissions:
  contents: read

jobs:
  harness-commit-acceptance:
    name: harness-commit-acceptance
    runs-on: ubuntu-latest
    steps:
      - name: Reject closed unmerged pull request
        if: github.event.action == 'closed' && github.event.pull_request.merged != true
        run: exit 1
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: pip install -r .harness/scripts/requirements.txt
      - name: Resolve task binding
        id: binding
        run: python3 .harness/scripts/ci_binding.py --event "$GITHUB_EVENT_PATH" --github-output "$GITHUB_OUTPUT"
      - name: Run subject-bound GC review
        env:
          HARNESS_GC_REVIEW_URL: ${{ secrets.HARNESS_GC_REVIEW_URL }}
          HARNESS_GC_REVIEW_TOKEN: ${{ secrets.HARNESS_GC_REVIEW_TOKEN }}
          TASK_ID: ${{ steps.binding.outputs.task_id }}
          TASK_SCOPE: ${{ steps.binding.outputs.scope }}
          TASK_TIER: ${{ steps.binding.outputs.tier }}
        run: |
          python3 .harness/scripts/ci_gc_review.py \
            --harness-root "$GITHUB_WORKSPACE" --product-root "$GITHUB_WORKSPACE" \
            --task-id "$TASK_ID" --commit "$GITHUB_SHA" --tier "$TASK_TIER" \
            --scope "$TASK_SCOPE" --output gc-result.json | tee gc-review-output.json
          python3 -c "import json; d=json.load(open('gc-review-output.json')); assert d['decision']=='pass', d"
      - name: Evaluate target commit
        env:
          TASK_ID: ${{ steps.binding.outputs.task_id }}
          TASK_SCOPE: ${{ steps.binding.outputs.scope }}
          TASK_TIER: ${{ steps.binding.outputs.tier }}
        run: |
          GC_ARGS=""
          if [ -s gc-result.json ]; then GC_ARGS="--gc-result gc-result.json"; fi
          python3 .harness/scripts/harness_runtime.py \
            --product-root "$GITHUB_WORKSPACE" ci-check \
            --task-id "$TASK_ID" --commit "$GITHUB_SHA" \
            --tier "$TASK_TIER" --scope "$TASK_SCOPE" \
            $GC_ARGS \
            --output harness-result.json | tee harness-result-output.json
          python3 -c "import json; d=json.load(open('harness-result-output.json')); assert d['decision']=='pass', d"
      - name: Upload Harness result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: harness-result-${{ github.sha }}
          path: harness-result.json
          if-no-files-found: warn

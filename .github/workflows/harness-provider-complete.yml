name: Harness Provider Complete

on:
  workflow_run:
    workflows: ["Harness Required"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  provider-complete:
    runs-on: ubuntu-latest
    steps:
      - name: Reject unsuccessful required run
        if: github.event.workflow_run.conclusion != 'success'
        run: exit 1
      - name: Resolve merged commit and successful required run
        if: github.event.workflow_run.conclusion == 'success'
        id: lifecycle
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const refs = await github.paginate(github.rest.repos.listPullRequestsAssociatedWithCommit, {
              owner: context.repo.owner, repo: context.repo.repo, commit_sha: run.head_sha, per_page: 100
            });
            const targetBranch = context.payload.repository.default_branch;
            const merged = refs.filter(item => item.merged_at && item.merge_commit_sha === run.head_sha
              && item.base.ref === targetBranch);
            if (merged.length !== 1) {
              core.setOutput('eligible', 'false');
              return;
            }
            core.setOutput('eligible', 'true');
            core.setOutput('commit', run.head_sha);
            core.setOutput('required_run_id', String(run.id));
      - name: Reject non-target or non-merge run
        if: steps.lifecycle.outputs.eligible != 'true'
        run: exit 1
      - uses: actions/checkout@v4
        if: steps.lifecycle.outputs.eligible == 'true'
        with:
          ref: ${{ steps.lifecycle.outputs.commit }}
      - uses: actions/setup-python@v5
        if: steps.lifecycle.outputs.eligible == 'true'
        with:
          python-version: "3.11"
      - name: Install Harness runtime dependencies
        if: steps.lifecycle.outputs.eligible == 'true'
        run: pip install -r .harness/scripts/requirements.txt
      - uses: actions/download-artifact@v4
        if: steps.lifecycle.outputs.eligible == 'true'
        with:
          pattern: harness-result-*
          path: harness-artifacts
          merge-multiple: true
          run-id: ${{ steps.lifecycle.outputs.required_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build subject-bound lifecycle receipt
        if: steps.lifecycle.outputs.eligible == 'true'
        env:
          VERIFIED_COMMIT: ${{ steps.lifecycle.outputs.commit }}
          HARNESS_RUN_ID: ${{ github.run_id }}
          HARNESS_REPOSITORY: ${{ github.repository }}
        run: |
          python3 .harness/scripts/provider_lifecycle.py receipt \
            --result harness-artifacts/harness-result.json \
            --event merge --commit "$VERIFIED_COMMIT" \
            --repository "$HARNESS_REPOSITORY" --run-id "$HARNESS_RUN_ID" \
            --output lifecycle-receipt.json
      - name: Complete bound Work Item
        if: steps.lifecycle.outputs.eligible == 'true'
        env:
          HARNESS_CI_COMMIT_SHA: ${{ steps.lifecycle.outputs.commit }}
          HARNESS_REQUIRED_CHECK: harness-commit-acceptance
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DONE_TRANSITION_ID: ${{ secrets.JIRA_DONE_TRANSITION_ID }}
          DINGTALK_APP_KEY: ${{ secrets.DINGTALK_APP_KEY }}
          DINGTALK_APP_SECRET: ${{ secrets.DINGTALK_APP_SECRET }}
          DINGTALK_OPERATOR_USER_ID: ${{ secrets.DINGTALK_OPERATOR_USER_ID }}
          TEAMBITION_OPEN_API_AUTHORIZATION: ${{ secrets.TEAMBITION_OPEN_API_AUTHORIZATION }}
          TEAMBITION_OPEN_APP_ID: ${{ secrets.TEAMBITION_OPEN_APP_ID }}
          TEAMBITION_OPEN_APP_SECRET: ${{ secrets.TEAMBITION_OPEN_APP_SECRET }}
          TEAMBITION_TENANT_ID: ${{ secrets.TEAMBITION_TENANT_ID }}
          TEAMBITION_OPEN_OPERATOR_ID: ${{ secrets.TEAMBITION_OPEN_OPERATOR_ID }}
        run: |
          WORK_ITEM_ID=$(python3 -c "import json; print(json.load(open('lifecycle-receipt.json'))['work_item_id'])")
          bash .harness/scripts/work_item.sh close --id "$WORK_ITEM_ID" \
            --status done --lifecycle-receipt lifecycle-receipt.json \
            | tee provider-complete-output.json
          python3 -c "import json; d=json.load(open('provider-complete-output.json')); assert d['decision']=='pass', d"

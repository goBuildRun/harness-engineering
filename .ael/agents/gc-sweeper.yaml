name: gc-sweeper
description: "专职垃圾回收与代码清理代理"
role: "项目清道夫 / 熵减工程师"
system_prompt_ref: ".ael/rules/gc-golden-principles.md"
permissions:
  - default_context: task_contract_actual_diff_changed_files_direct_dependencies
  - can_expand_context_only_with_reason: true
  - can_modify_business_code: true
  - can_delete_files: true
  - can_add_new_features: false  # 严禁此 Agent 开发新功能！
capabilities:
  - 扫描并移除各个业务 Agent 遗留的无用函数 (Dead Code)
  - 清理过期且无意义的 AI 过程注释
  - 整理由于频繁 TDD 重构而导致混乱的模块结构
  - 将超出任务范围的技术债创建或关联产品 Work Item，不扩大当前验收范围

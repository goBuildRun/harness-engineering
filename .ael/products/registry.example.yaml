# Example only. Local registry.yaml is generated by ael_init.sh and is gitignored.
products:
  - id: example-product
    name: Example Product
    profile: generic
    root: /absolute/path/to/example-product
    workspace: ael-workspace
    config: ael-workspace/project.yaml
    work_item_provider: noop
    work_item_id_pattern: "^[0-9a-f]{24}$"
    bmad_install_root: .
    bmad_output_root: ael-workspace/bmad-output
    created_at: "YYYY-MM-DDTHH:MM:SSZ"
